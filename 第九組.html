<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>想找實習的高中生個人作品集</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e7eb 100%);
            --text-color: #333;
            --card-bg: #white;
            --card-text: #555;
            --hero-desc: #666;
            --section-title-color: #4a5568;
            --primary-color: #764ba2;
            --input-bg: #fff;
            --input-border: #ccc;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            --text-color: #f7fafc;
            --card-bg: #2d3748;
            --card-text: #cbd5e0;
            --hero-desc: #a0aec0;
            --section-title-color: #e2e8f0;
            --primary-color: #9f7aea;
            --input-bg: #1a202c;
            --input-border: #4a5568;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans CJK TC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
        }

        /* 深色模式切換按鈕 */
        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .theme-toggle:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .hero {
            padding: 2rem 0;
        }

        /* 頭像上傳區塊 */
        .profile-pic-label {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            font-weight: bold;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 5px solid white;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .profile-pic-label:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        #file-input {
            display: none;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.4rem;
            color: var(--hero-desc);
            font-weight: 300;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 3rem auto;
        }

        /* 內容區塊樣式 */
        .section-title {
            font-size: 1.8rem;
            color: var(--section-title-color);
            margin: 2rem 0 1rem 0;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: left;
        }
        .card h3 { color: var(--primary-color); margin-bottom: 0.5rem; }
        .card p { color: var(--card-text); font-size: 0.95rem; line-height: 1.5; }

        /* 聯絡區表單樣式 */
        .contact-form {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 600px;
            margin: 1rem auto 0 auto;
            text-align: left;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        #form-msg {
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
            color: #48bb78;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1.1rem; }
            .profile-pic-label { width: 150px; height: 150px; font-size: 1rem; }
            .theme-toggle { top: 1rem; right: 1rem; padding: 0.3rem 0.8rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="theme-toggle-btn">🌙 切換深色模式</button>

    <div class="container">
        <section class="hero">
            <label for="file-input" class="profile-pic-label" id="upload-preview">
                <span>點我上傳<br>大頭貼</span>
            </label>
            <input type="file" id="file-input" accept="image/*">
            
            <h1>你的名字</h1>
            <p>熱衷於學習新技術 ✨ 享受解決問題的成就感 🚀 期望能加入一家充滿熱情的團隊，透過實習累積實戰經驗，為公司帶來價值！</p>
        </section>

        <section>
            <h2 class="section-title">我的作品區</h2>
            <div class="grid">
                <div class="card">
                    <h3>💻 作品一：個人履歷網站</h3>
                    <p>使用 HTML5 與 CSS3 刻出響應式個人首頁，支援圖片即時預覽與手機排版。</p>
                </div>
                <div class="card">
                    <h3>🚀 作品二：Python 小遊戲</h3>
                    <p>利用 Pygame 獨立開發的趣味闖關遊戲，訓練邏輯思維與物件導向程式設計能力。</p>
                </div>
                <div class="card">
                    <h3>📊 作品三：自主學習專案</h3>
                    <p>探討 AI 工具在日常生活中的應用與影響，並撰寫專題研究報告獲得優等。</p>
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title">聯絡我</h2>
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" required placeholder="請輸入您的姓名">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label for="message">留言內容</label>
                        <textarea id="message" required placeholder="想聊聊實習機會或給予指教..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">送出留言</button>
                    <div id="form-msg"></div>
                </form>
            </div>
        </section>
    </div>

    <script>
        // 1. 處理大頭貼即時預覽
        const fileInput = document.getElementById('file-input');
        const uploadPreview = document.getElementById('upload-preview');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadPreview.style.backgroundImage = `url('${event.target.result}')`;
                    uploadPreview.querySelector('span').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. 聯絡表單送出互動提示
        const contactForm = document.getElementById('contactForm');
        const formMsg = document.getElementById('form-msg');

        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            formMsg.textContent = "✨ 感謝您的留言！訊息已成功送出（此為前端展示效果）。";
            contactForm.reset();
            setTimeout(() => {
                formMsg.textContent = "";
            }, 5000);
        });

        // 3. 加分功能：深色模式切換
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', function() {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.removeAttribute('data-theme');
                themeToggleBtn.textContent = '🌙 切換深色模式';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '☀️ 切換亮色模式';
            }
        });
    </script>
</body>
</html>
